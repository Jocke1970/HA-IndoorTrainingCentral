name: Backend protocol tests
on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [beta, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pytest pytest-asyncio
      - run: python -m compileall -q custom_components
      - run: pytest -q tests
      - name: Validate custom dashboard JS syntax
        run: |
          node --check custom_components/homefitnesscode/www/homefitnesscode-card.js
          node tests/test_card_registration.cjs
