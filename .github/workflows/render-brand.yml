name: Render Home Assistant brand images
on:
  push:
    branches: [dev]
    paths:
      - "assets/branding/itc-icon.svg"
      - "scripts/render_brand.py"
      - ".github/workflows/render-brand.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itc-brand-assets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Render exact brand PNG sizes
        run: |
          python -m pip install cairosvg
          python scripts/render_brand.py
      - name: Check output size and PNG signature
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("custom_components/homefitnesscode/brand")
          for name in ["icon.png", "icon@2x.png"]:
              image = (root / name).read_bytes()
              assert image.startswith(b"\x89PNG\r\n\x1a\n"), name
              assert len(image) > 1000, name
          PY
      - name: Commit generated image files to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/homefitnesscode/brand/icon.png
          git add custom_components/homefitnesscode/brand/icon@2x.png
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "assets: generate local Home Assistant ITC brand icons"
            git push origin HEAD:dev
          fi
